name: Aplicar configuração comercial ao catálogo autenticado

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-commercial-enrichment.yml'
      - 'scripts/catalog-v2/apply-commercial-enrichment.py'
      - 'functions/api/catalog-v2.js'
      - 'functions/api/_accepted_catalog.js'
      - 'tests/catalog-v2/accepted-catalog-public-scrub.test.mjs'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/authenticated-drive-indexer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authenticated-drive-indexer
          fetch-depth: 0
      - name: Aplicar enriquecimento comercial
        run: python scripts/catalog-v2/apply-commercial-enrichment.py
      - name: Validar preços e quantidades dinâmicos
        run: |
          set -euo pipefail
          node --check functions/api/catalog-v2.js
          node --check functions/api/_accepted_catalog.js
          node --test tests/catalog-v2/accepted-catalog-public-scrub.test.mjs
          grep -Fq 'commercial' functions/api/catalog-v2.js
          grep -Fq 'initialQuantity = config.initial' functions/api/_accepted_catalog.js
      - name: Registrar enriquecimento
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Enriquecimento já aplicado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/catalog-v2.js functions/api/_accepted_catalog.js
          git commit -m 'Mantém preços do admin no catálogo autenticado'
          git push origin HEAD:feat/authenticated-drive-indexer
