name: Aceitar Versões do Catálogo V2

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      forcar_validacao:
        description: 'Executar a validação completa mesmo quando a versão não mudou'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-v2-auto-accept
  cancel-in-progress: false

jobs:
  validate-and-accept:
    name: Validar e promover versão compatível
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: site-v2-staging

    env:
      CATALOG_LEGACY_BASE_URL: https://new-hub-artres.pages.dev
      CATALOG_V2_ROOT_DRIVE_ID: 193kW8g7EsmrNwlGE3ugbC3qzOcDEwUae
      SUPABASE_V2_URL: https://kueklnkznwpbobqwugns.supabase.co
      SUPABASE_V2_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_V2_STAGING_SERVICE_ROLE_KEY }}
      CATALOG_REPORT_FILE: /tmp/catalog-v2-auto-accept-report.json
      CATALOG_INSPECTION_MAX_REQUESTS: '2000'
      CATALOG_INSPECTION_MAX_FOLDERS: '2000'
      CATALOG_INSPECTION_MAX_ARTWORKS: '100000'
      CATALOG_FORCE_ACCEPT: ${{ inputs.forcar_validacao || false }}
      TRACKING_ISSUE_NUMBER: '16'

    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validar segredo exclusivo do staging
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_V2_STAGING_SERVICE_ROLE_KEY" ]; then
            echo "Segredo obrigatório ausente: SUPABASE_V2_STAGING_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Executar testes defensivos do catálogo
        run: node --test tests/catalog-v2/*.test.mjs tests/v2/catalog-accepted-route.test.mjs

      - name: Validar, carregar e aceitar versão nova
        id: publish
        run: node scripts/catalog-v2/publish-accepted-catalog-v2.mjs

      - name: Anexar relatório sanitizado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-v2-auto-accept-report
          path: ${{ env.CATALOG_REPORT_FILE }}
          retention-days: 1
          if-no-files-found: ignore

      - name: Registrar mudança ou falha na issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: node scripts/catalog-v2/post-catalog-auto-accept-status.mjs

      - name: Remover relatório temporário
        if: always()
        run: rm -f "$CATALOG_REPORT_FILE"
