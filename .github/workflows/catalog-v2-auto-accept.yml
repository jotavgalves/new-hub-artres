name: Sincronizar Catálogo Privado V2

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-v2-auto-accept.yml'
      - 'scripts/catalog-v2/private-drive-catalog-indexer.mjs'
      - 'scripts/catalog-v2/publish-private-drive-catalog-v2.mjs'
      - 'scripts/catalog-v2/service-account-google-drive.mjs'
  workflow_dispatch:
    inputs:
      forcar_validacao:
        description: 'Publicar uma nova versão mesmo quando o conteúdo não mudou'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-v2-private-drive-sync
  cancel-in-progress: false

jobs:
  validate-and-accept:
    name: Ler Drives privados e publicar versão atômica
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: site-v2-staging

    env:
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
      SUPABASE_V2_URL: https://kueklnkznwpbobqwugns.supabase.co
      SUPABASE_V2_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_V2_STAGING_SERVICE_ROLE_KEY }}
      CATALOG_REPORT_FILE: /tmp/catalog-v2-private-drive-report.json
      CATALOG_INSPECTION_MAX_FOLDERS: '10000'
      CATALOG_INSPECTION_MAX_ARTWORKS: '250000'
      CATALOG_INSPECTION_MAX_DEPTH: '30'
      CATALOG_FORCE_ACCEPT: ${{ inputs.forcar_validacao || false }}
      TRACKING_ISSUE_NUMBER: '16'

    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Executar testes defensivos do catálogo
        run: node --test tests/catalog-v2/*.test.mjs tests/v2/catalog-accepted-route.test.mjs

      - name: Validar sintaxe dos módulos autenticados
        run: |
          set -euo pipefail
          node --check scripts/catalog-v2/service-account-google-drive.mjs
          node --check scripts/catalog-v2/private-drive-catalog-indexer.mjs
          node --check scripts/catalog-v2/publish-private-drive-catalog-v2.mjs
          node --check functions/api/_accepted_catalog.js
          node --check functions/api/catalog-image.js

      - name: Ler, validar e publicar catálogo privado
        id: publish
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Tentativa $attempt/3 de sincronização do catálogo V2"
            if node scripts/catalog-v2/publish-private-drive-catalog-v2.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo 'A sincronização falhou após 3 tentativas completas.' >&2
          exit 1

      - name: Anexar relatório detalhado privado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-v2-private-drive-report
          path: |
            ${{ env.CATALOG_REPORT_FILE }}
            ${{ env.CATALOG_REPORT_FILE }}.details.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Registrar mudança ou falha na issue
        if: always() && (steps.publish.outputs.configured != 'false' || steps.publish.outcome != 'success')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: node scripts/catalog-v2/post-catalog-auto-accept-status.mjs

      - name: Remover relatórios temporários
        if: always()
        run: rm -f "$CATALOG_REPORT_FILE" "$CATALOG_REPORT_FILE.details.json"
