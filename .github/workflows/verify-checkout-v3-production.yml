name: Verificar checkout V3 no site oficial

on:
  pull_request:
    paths:
      - '.github/workflows/verify-checkout-v3-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    name: Checkout V3 publicado
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Aguardar asset e carregador no domínio oficial
        shell: bash
        run: |
          set -euo pipefail
          base='https://new-hub-artres.pages.dev'
          for attempt in $(seq 1 72); do
            stamp="$(date +%s)-${attempt}"
            loader="$(curl --fail --silent --show-error --location --max-time 20 "${base}/assets/catalog-cache-bust.js?_verify=${stamp}" || true)"
            checkout="$(curl --fail --silent --show-error --location --max-time 20 "${base}/assets/checkout-v3.js?v=20260804-1&_verify=${stamp}" || true)"
            home="$(curl --fail --silent --show-error --location --max-time 20 "${base}/?_verify=${stamp}" || true)"

            if grep -q 'checkoutV3Script' <<<"$loader" \
              && grep -q 'checkout-v3.js?v=20260804-1' <<<"$loader" \
              && grep -q 'Confira suas artes' <<<"$checkout" \
              && grep -q 'Como podemos falar com você' <<<"$checkout" \
              && grep -q 'Registrando seu pedido' <<<"$checkout" \
              && grep -q "addEventListener('click',interceptCheckout,true)" <<<"$checkout" \
              && grep -q 'catalog-cache-bust.js' <<<"$home"; then
              echo 'CHECKOUT_V3_PRODUCTION_OK'
              exit 0
            fi

            echo "Tentativa ${attempt}: publicação ainda não propagada por completo."
            sleep 5
          done

          echo 'CHECKOUT_V3_PRODUCTION_NOT_PROPAGATED'
          exit 1
