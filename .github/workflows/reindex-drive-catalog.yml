name: Reindex Drive Catalog

on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reindex-drive-catalog.yml'
      - 'scripts/reindex-drive-catalog.mjs'
  workflow_dispatch:
    inputs:
      root_folder_id:
        description: "ID de uma pasta raiz específica. Vazio sincroniza as duas raízes de produção."
        required: false
        type: string
      dry_run:
        description: "Rodar sem gravar no Supabase"
        required: true
        default: false
        type: boolean
      max_depth:
        description: "Profundidade máxima de subpastas"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: drive-catalog-reindex
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reindex catalog
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ARTS_SUPABASE_URL: ${{ secrets.ARTS_SUPABASE_URL }}
          ARTS_SUPABASE_SERVICE_KEY: ${{ secrets.ARTS_SUPABASE_SERVICE_KEY }}
          MANUAL_ROOT_FOLDER_ID: ${{ inputs.root_folder_id || '' }}
          CATALOG_INDEX_MAX_DEPTH: ${{ inputs.max_depth || '30' }}
          CATALOG_INDEX_DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          roots=()
          if [ -n "$MANUAL_ROOT_FOLDER_ID" ]; then
            roots+=("$MANUAL_ROOT_FOLDER_ID")
          else
            roots+=(
              "193kW8g7EsmrNwlGE3ugbC3qzOcDEwUae"
              "18x1qthD2RXAxRi2u-d7U3wpJLfpINU7-"
            )
          fi

          for root in "${roots[@]}"; do
            echo "Sincronizando raiz $root"
            args=(--root="$root" --max-depth="$CATALOG_INDEX_MAX_DEPTH")
            if [ "$CATALOG_INDEX_DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
            node scripts/reindex-drive-catalog.mjs "${args[@]}"
          done
