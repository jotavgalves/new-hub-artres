name: Publicar Site V2 Staging Sintético

on:
  push:
    branches:
      - main
    paths:
      - 'src/v2/**'
      - 'scripts/v2/**'
      - 'staging/site-v2-worker/**'
      - 'wrangler.site-v2-staging.jsonc'
      - 'tests/v2/run-staging-synthetic-remote-smoke.mjs'
      - '.github/workflows/deploy-site-v2-staging.yml'
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PUBLICAR STAGING SINTETICO para confirmar'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-v2-staging-deploy
  cancel-in-progress: false

jobs:
  authorize-deploy:
    name: Autorizar deploy automático ou manual
    runs-on: ubuntu-latest
    steps:
      - name: Validar origem do gatilho
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CONFIRMACAO: ${{ inputs.confirmacao || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            echo "Deploy automático autorizado por alteração da V2 incorporada à main."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRMACAO" = "PUBLICAR STAGING SINTETICO" ]; then
            echo "Deploy manual de contingência autorizado."
            exit 0
          fi

          echo "Gatilho não autorizado. Nenhuma publicação foi realizada."
          exit 1

  deploy-staging:
    name: Publicar e validar staging sintético
    needs: authorize-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: site-v2-staging

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_V2_STAGING_API_TOKEN: ${{ secrets.SITE_V2_STAGING_API_TOKEN }}
      SUPABASE_V2_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_V2_STAGING_SERVICE_ROLE_KEY }}
      STAGING_URL: https://new-hub-artres-v2-staging.jvgacontato.workers.dev
      STAGING_SECRETS_FILE: /tmp/site-v2-staging-secrets.json
      ROLLBACK_CONFIG_FILE: wrangler.site-v2-staging.rollback.runtime.jsonc

    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Registrar contexto sem expor segredos
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Destino: staging isolado"

      - name: Validar segredos obrigatórios
        run: |
          missing=0
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SITE_V2_STAGING_API_TOKEN; do
            if [ -z "${!variable}" ]; then
              echo "Segredo obrigatório ausente: $variable"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Preparar secrets e configuração de rollback
        run: |
          umask 077
          node scripts/v2/prepare-site-v2-staging-deploy.mjs

      - name: Executar testes isolados
        run: node --test tests/v2/*.test.mjs

      - name: Validar bundle ativo sem publicar
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --dry-run
          --strict
          --config wrangler.site-v2-staging.jsonc
          --secrets-file "$STAGING_SECRETS_FILE"
          --outdir /tmp/site-v2-staging-active-dry-run

      - name: Validar bundle de rollback sem publicar
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --dry-run
          --strict
          --config "$ROLLBACK_CONFIG_FILE"
          --secrets-file "$STAGING_SECRETS_FILE"
          --outdir /tmp/site-v2-staging-rollback-dry-run

      - name: Publicar Worker com escrita exclusivamente sintética
        id: deploy
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --strict
          --config wrangler.site-v2-staging.jsonc
          --secrets-file "$STAGING_SECRETS_FILE"
          --message "Staging V2 automático com escrita exclusivamente sintética"
          --tag "staging-synthetic-writes-enabled"

      - name: Validar pedido, replay, painel e bloqueios
        id: remote-smoke
        run: node tests/v2/run-staging-synthetic-remote-smoke.mjs

      - name: Reverter automaticamente para escrita e sombra desativadas em caso de falha
        if: failure() && steps.deploy.outcome == 'success'
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --strict
          --config "$ROLLBACK_CONFIG_FILE"
          --secrets-file "$STAGING_SECRETS_FILE"
          --message "Rollback automático: escrita e sombra do staging desativadas"
          --tag "staging-writes-disabled-automatic-rollback"

      - name: Remover arquivos temporários
        if: always()
        run: rm -f "$STAGING_SECRETS_FILE" "$ROLLBACK_CONFIG_FILE"

      - name: Registrar garantia de isolamento
        if: success()
        run: |
          echo "Worker: new-hub-artres-v2-staging"
          echo "Painel: /admin"
          echo "Rotas de domínio de produção: nenhuma"
          echo "Escrita comercial: habilitada somente para catálogo sintético"
          echo "Rota técnica do ledger: desabilitada"
          echo "Projeção Supabase sombra: controlada por flag e desativada por padrão"
          echo "Catálogo: synthetic-staging-only, versão 9001"
          echo "Produção pública: não alterada"
