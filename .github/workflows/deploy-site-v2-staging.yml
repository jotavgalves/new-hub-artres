name: Publicar Site V2 Staging

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PUBLICAR STAGING para confirmar'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-v2-staging-deploy
  cancel-in-progress: false

jobs:
  validate-confirmation:
    name: Validar confirmação manual
    runs-on: ubuntu-latest
    steps:
      - name: Exigir frase exata
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ "$CONFIRMACAO" != "PUBLICAR STAGING" ]; then
            echo "Confirmação inválida. Nenhuma publicação foi realizada."
            exit 1
          fi

  deploy-staging:
    name: Publicar Worker isolado
    needs: validate-confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: site-v2-staging

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_V2_STAGING_API_TOKEN: ${{ secrets.SITE_V2_STAGING_API_TOKEN }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar segredos obrigatórios
        run: |
          missing=0
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SITE_V2_STAGING_API_TOKEN; do
            if [ -z "${!variable}" ]; then
              echo "Segredo obrigatório ausente: $variable"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Executar testes isolados
        run: node --test tests/v2/*.test.mjs

      - name: Validar bundle sem publicar
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --dry-run
          --config wrangler.site-v2-staging.jsonc
          --outdir /tmp/site-v2-staging-dry-run

      - name: Publicar Worker com escrita desabilitada
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --config wrangler.site-v2-staging.jsonc

      - name: Configurar token exclusivo do staging
        run: |
          printf '%s' "$SITE_V2_STAGING_API_TOKEN" |
            npx --yes wrangler@4.114.0 secret put STAGING_API_TOKEN \
              --config wrangler.site-v2-staging.jsonc

      - name: Registrar garantia de isolamento
        run: |
          echo "Worker: new-hub-artres-v2-staging"
          echo "Rotas de domínio: nenhuma"
          echo "Escrita: desabilitada"
          echo "Catálogo: sintético"
          echo "Produção pública: não alterada"
