name: Publicar Site V2 Staging

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'src/v2/**'
      - 'scripts/v2/**'
      - 'scripts/catalog-v2/**'
      - 'staging/site-v2-worker/**'
      - 'supabase/migrations/**'
      - 'wrangler.site-v2-staging.jsonc'
      - 'tests/v2/run-staging-synthetic-remote-smoke.mjs'
      - 'tests/v2/run-staging-synthetic-remote-smoke-with-code.mjs'
      - 'tests/v2/run-staging-supabase-shadow-remote-smoke.mjs'
      - 'tests/v2/run-staging-accepted-catalog-remote-smoke.mjs'
      - 'tests/v2/run-staging-checkout-validation-remote-smoke.mjs'
      - 'tests/v2/run-staging-checkout-invalid-rejections-remote-smoke.mjs'
      - 'tests/v2/run-staging-checkout-protection-remote-smoke.mjs'
      - 'tests/v2/run-staging-public-checkout-remote-smoke.mjs'
      - '.github/workflows/deploy-site-v2-staging.yml'
      - '.github/workflows/catalog-v2-auto-accept.yml'
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PUBLICAR STAGING V2 para confirmar'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: site-v2-staging-deploy
  cancel-in-progress: false

jobs:
  authorize-deploy:
    name: Autorizar deploy automático ou manual
    runs-on: ubuntu-latest
    steps:
      - name: Validar origem do gatilho
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CONFIRMACAO: ${{ inputs.confirmacao || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            echo "Deploy automático autorizado por alteração da V2 incorporada à main."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRMACAO" = "PUBLICAR STAGING V2" ]; then
            echo "Deploy manual de contingência autorizado."
            exit 0
          fi

          echo "Gatilho não autorizado. Nenhuma publicação foi realizada."
          exit 1

  deploy-staging:
    name: Publicar e validar staging V2
    needs: authorize-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: site-v2-staging

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_V2_STAGING_API_TOKEN: ${{ secrets.SITE_V2_STAGING_API_TOKEN }}
      SUPABASE_V2_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_V2_STAGING_SERVICE_ROLE_KEY }}
      STAGING_URL: https://new-hub-artres-v2-staging.jvgacontato.workers.dev
      CATALOG_LEGACY_BASE_URL: https://new-hub-artres.pages.dev
      CATALOG_V2_ROOT_DRIVE_ID: 193kW8g7EsmrNwlGE3ugbC3qzOcDEwUae
      CATALOG_REPORT_FILE: /tmp/catalog-v2-deploy-accept-report.json
      CATALOG_INSPECTION_MAX_REQUESTS: '2000'
      CATALOG_INSPECTION_MAX_FOLDERS: '2000'
      CATALOG_INSPECTION_MAX_ARTWORKS: '100000'
      SUPABASE_V2_URL: https://kueklnkznwpbobqwugns.supabase.co
      STAGING_SECRETS_FILE: /tmp/site-v2-staging-secrets.json
      ROLLBACK_CONFIG_FILE: wrangler.site-v2-staging.rollback.runtime.jsonc
      TRACKING_ISSUE_NUMBER: '16'

    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Registrar contexto sem expor segredos
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Destino: staging isolado"

      - name: Validar segredos obrigatórios
        run: |
          missing=0
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SITE_V2_STAGING_API_TOKEN SUPABASE_V2_STAGING_SERVICE_ROLE_KEY; do
            if [ -z "${!variable}" ]; then
              echo "Segredo obrigatório ausente: $variable"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Preparar secrets e configuração de rollback
        run: |
          umask 077
          node scripts/v2/prepare-site-v2-staging-deploy.mjs

      - name: Executar testes isolados
        run: node --test tests/v2/*.test.mjs tests/catalog-v2/*.test.mjs

      - name: Validar e aceitar catálogo real antes do deploy
        id: catalog-accept
        run: node scripts/catalog-v2/publish-accepted-catalog-v2.mjs

      - name: Preparar cópia isolada do design público atual
        run: node scripts/v2/prepare-site-v2-static-assets.mjs

      - name: Validar bundle ativo sem publicar
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --dry-run
          --strict
          --config wrangler.site-v2-staging.jsonc
          --secrets-file "$STAGING_SECRETS_FILE"
          --outdir /tmp/site-v2-staging-active-dry-run

      - name: Validar bundle de rollback sem publicar
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --dry-run
          --strict
          --config "$ROLLBACK_CONFIG_FILE"
          --secrets-file "$STAGING_SECRETS_FILE"
          --outdir /tmp/site-v2-staging-rollback-dry-run

      - name: Publicar Worker, design atual e catálogo aceito
        id: deploy
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --strict
          --config wrangler.site-v2-staging.jsonc
          --secrets-file "$STAGING_SECRETS_FILE"
          --message "Staging V2 com checkout visual, catálogo aceito e projeção sombra"
          --tag "staging-v2-visual-checkout"

      - name: Validar catálogo real aceito e design servido
        id: catalog-smoke
        shell: bash
        run: |
          set +e
          output="$(node tests/v2/run-staging-accepted-catalog-remote-smoke.mjs 2>&1)"
          status=$?
          printf '%s\n' "$output"
          code="$(printf '%s\n' "$output" | grep -E '^[A-Z0-9_]{3,100}$' | tail -n 1 || true)"
          if [[ "$code" =~ ^[A-Z0-9_]{3,100}$ ]]; then
            echo "error_code=$code" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Validar contrato rejeições proteção e checkout visual público
        id: checkout-contract-smoke
        shell: bash
        run: |
          set +e
          primary_output="$(node tests/v2/run-staging-checkout-validation-remote-smoke.mjs 2>&1)"
          status=$?
          output="$primary_output"

          if [ "$status" -eq 0 ]; then
            rejection_output="$(node tests/v2/run-staging-checkout-invalid-rejections-remote-smoke.mjs 2>&1)"
            status=$?
            output="${output}"$'\n'"${rejection_output}"
          fi

          if [ "$status" -eq 0 ]; then
            protection_output="$(node tests/v2/run-staging-checkout-protection-remote-smoke.mjs 2>&1)"
            status=$?
            output="${output}"$'\n'"${protection_output}"
          fi

          if [ "$status" -eq 0 ]; then
            visual_output="$(node tests/v2/run-staging-public-checkout-remote-smoke.mjs 2>&1)"
            status=$?
            output="${output}"$'\n'"${visual_output}"
          fi

          printf '%s\n' "$output"
          code="$(printf '%s\n' "$output" | grep -E '^[A-Z0-9_]{3,100}$' | tail -n 1 || true)"
          if [[ "$code" =~ ^[A-Z0-9_]{3,100}$ ]]; then
            echo "error_code=$code" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Validar pedido, replay, painel e bloqueios
        id: remote-smoke
        shell: bash
        run: |
          set +e
          output="$(node tests/v2/run-staging-synthetic-remote-smoke-with-code.mjs 2>&1)"
          status=$?

          if [ "$status" -ne 0 ]; then
            sleep 10
            retry_output="$(GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}-retry2" node tests/v2/run-staging-synthetic-remote-smoke-with-code.mjs 2>&1)"
            status=$?
            output="${output}"$'\n'"${retry_output}"
          fi

          printf '%s\n' "$output"
          code="$(printf '%s\n' "$output" | grep -E '^[A-Z0-9_]{3,100}$' | tail -n 1 || true)"
          if [[ "$code" =~ ^[A-Z0-9_]{3,100}$ ]]; then
            echo "error_code=$code" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Validar projeção sombra no Supabase
        id: shadow-smoke
        run: node tests/v2/run-staging-supabase-shadow-remote-smoke.mjs

      - name: Reverter automaticamente checkout escrita e sombra em caso de falha
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --strict
          --config "$ROLLBACK_CONFIG_FILE"
          --secrets-file "$STAGING_SECRETS_FILE"
          --message "Rollback automático: checkout, escrita e sombra do staging desativados"
          --tag "staging-checkout-writes-shadow-disabled-rollback"

      - name: Remover arquivos temporários
        if: always()
        run: rm -f "$STAGING_SECRETS_FILE" "$ROLLBACK_CONFIG_FILE" "$CATALOG_REPORT_FILE" && rm -rf staging/site-v2-public

      - name: Registrar garantia de isolamento
        if: success()
        run: |
          echo "Worker: new-hub-artres-v2-staging"
          echo "Site: design público atual com bridge de checkout injetado somente na cópia de staging"
          echo "Catálogo: versão aceita no Supabase de staging, somente leitura"
          echo "Painel: /admin"
          echo "Rotas de domínio de produção: nenhuma"
          echo "Checkout público V2: ativo somente no staging"
          echo "Validação de produto, variante, tamanho e rejeições: aprovada"
          echo "Proteção de origem e rate limit do checkout: aprovada"
          echo "Idempotência visual CREATED e REPLAY: aprovada"
          echo "Rota técnica do ledger: desabilitada"
          echo "Projeção Supabase sombra: habilitada e validada"
          echo "Produção pública: não alterada"

      - name: Registrar resultado sanitizado na issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
          CATALOG_ACCEPT_OUTCOME: ${{ steps.catalog-accept.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CATALOG_SMOKE_OUTCOME: ${{ steps.catalog-smoke.outcome }}
          CATALOG_SMOKE_ERROR_CODE: ${{ steps.catalog-smoke.outputs.error_code }}
          CHECKOUT_SMOKE_OUTCOME: ${{ steps.checkout-contract-smoke.outcome }}
          CHECKOUT_SMOKE_ERROR_CODE: ${{ steps.checkout-contract-smoke.outputs.error_code }}
          REMOTE_SMOKE_OUTCOME: ${{ steps.remote-smoke.outcome }}
          REMOTE_SMOKE_ERROR_CODE: ${{ steps.remote-smoke.outputs.error_code }}
          SHADOW_SMOKE_OUTCOME: ${{ steps.shadow-smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/v2/post-site-v2-staging-deploy-status.mjs
