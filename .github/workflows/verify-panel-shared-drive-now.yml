name: Diagnosticar pasta do Painel 150

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-panel-shared-drive-now.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspecionar páginas públicas do Google Drive
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const root = '18x1qthD2RXAxRi2u-d7U3wpJLfpINU7-';
          const urls = [
            `https://drive.google.com/embeddedfolderview?id=${root}#grid`,
            `https://drive.google.com/drive/folders/${root}?usp=sharing`,
            `https://drive.google.com/drive/u/0/folders/${root}`
          ];

          for (let index = 0; index < urls.length; index += 1) {
            const url = urls[index];
            const response = await fetch(url, {
              redirect: 'follow',
              headers: {
                'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/149 Safari/537.36',
                accept: 'text/html,application/xhtml+xml'
              }
            });
            const text = await response.text();
            await writeFile(`/tmp/drive-${index}.html`, text);
            const normalized = text
              .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)))
              .replace(/&quot;/g, '"')
              .replace(/&amp;/g, '&')
              .replace(/&#39;/g, "'")
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ');
            const upper = normalized.toUpperCase();
            const matches = [];
            for (const needle of ['ANA CASTELA', 'CASTELA', 'CODEX TESTE', 'ARCA DE NOÉ', 'ARCA DE NOE']) {
              let position = upper.indexOf(needle);
              while (position >= 0 && matches.length < 30) {
                matches.push(normalized.slice(Math.max(0, position - 180), Math.min(normalized.length, position + needle.length + 260)));
                position = upper.indexOf(needle, position + needle.length);
              }
            }
            const ids = [...new Set((text.match(/[A-Za-z0-9_-]{20,80}/g) || []))].slice(0, 40);
            console.log(JSON.stringify({
              requestedUrl: url,
              finalUrl: response.url,
              status: response.status,
              contentType: response.headers.get('content-type'),
              bytes: text.length,
              hasLogin: /accounts\.google\.com|ServiceLogin|Sign in/i.test(text),
              matches,
              sampleIds: ids
            }, null, 2));
          }
          NODE
