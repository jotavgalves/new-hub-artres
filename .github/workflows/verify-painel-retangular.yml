name: Verificar Painel Retangular

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-painel-retangular.yml'
      - '.github/workflows/reindex-drive-catalog.yml'
      - 'assets/painel-retangular-runtime.js'
      - 'assets/product-selector-polish.js'
      - 'assets/catalog-cache-bust.js'
      - 'assets/admin-products-v2.js'
      - 'assets/admin-retangular-1x2.js'
      - 'functions/index.js'
      - 'functions/adm/_middleware.js'
      - 'functions/api/painel-retangular.js'
      - 'functions/api/orders-unified.js'
      - 'functions/api/commercial-config.js'
      - 'functions/api/_order_product.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-painel-retangular-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Aguardar versão nova no Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://new-hub-artres.pages.dev'
          ok=0
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error --location --max-time 25 "$BASE/?_ret_verify=$(date +%s)" -o home.html || true
            curl --fail --silent --show-error --location --max-time 25 "$BASE/assets/painel-retangular-runtime.js?v=2&_ret_verify=$(date +%s)" -o rect.js || true
            curl --fail --silent --show-error --location --max-time 25 "$BASE/assets/product-selector-polish.js?v=1&_ret_verify=$(date +%s)" -o selector.js || true
            curl --fail --silent --show-error --location --max-time 25 "$BASE/assets/catalog-cache-bust.js?v=13&_ret_verify=$(date +%s)" -o loader.js || true
            if grep -q 'catalog-cache-bust.js?v=13' home.html 2>/dev/null \
              && grep -q "__ARMAZEM_PAINEL_RETANGULAR_RUNTIME__='1'" rect.js 2>/dev/null \
              && grep -q 'productionV2RetangularTab' rect.js 2>/dev/null \
              && grep -q '1fB01auWnc01DEy2EJfGK62l0MCgQLpXu' rect.js 2>/dev/null \
              && grep -q "__ARMAZEM_PRODUCT_SELECTOR_POLISH__='1'" selector.js 2>/dev/null \
              && grep -q 'productionV2TabPrice' selector.js 2>/dev/null \
              && grep -q 'painel-retangular-runtime.js?v=2' loader.js 2>/dev/null \
              && grep -q 'product-selector-polish.js?v=1' loader.js 2>/dev/null; then
              ok=1
              echo "Versão do Painel Retangular e seletor de preços publicada na tentativa $attempt."
              break
            fi
            echo "Aguardando Pages... tentativa $attempt/36"
            sleep 10
          done
          test "$ok" = 1

      - name: Validar configuração e API do catálogo
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://new-hub-artres.pages.dev'
          ROOT='1fB01auWnc01DEy2EJfGK62l0MCgQLpXu'
          curl --fail --silent --show-error --location --max-time 45 "$BASE/api/painel-retangular?mode=themes&_ret_verify=$(date +%s)" -o rect-themes.json
          node <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('rect-themes.json','utf8'));
          if(d.ok!==true || d.rootFolderId!=='1fB01auWnc01DEy2EJfGK62l0MCgQLpXu') throw new Error('RETANGULAR_API_ROOT_INVALID');
          if(!Array.isArray(d.folders)) throw new Error('RETANGULAR_THEMES_INVALID');
          if(d.folders.some(x=>x.productKey!=='retangular-1x2')) throw new Error('RETANGULAR_THEME_PRODUCT_LEAK');
          if(String(d.product?.label||'').toLowerCase()!=='painel retangular') throw new Error('RETANGULAR_API_LABEL_INVALID:'+d.product?.label);
          console.log(JSON.stringify({themes:d.folders.length,artworks:Number(d.artworkTotal||0),source:d.source,root:d.rootFolderId}));
          NODE

          curl --fail --silent --show-error --location --max-time 30 "$BASE/api/commercial-config?_ret_verify=$(date +%s)" -o commercial.json
          node <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('commercial.json','utf8'));
          const root='1fB01auWnc01DEy2EJfGK62l0MCgQLpXu';
          if(d.ok!==true) throw new Error('COMMERCIAL_NOT_OK');
          const p=d.config?.products?.['retangular-1x2'];
          const roman=d.config?.products?.['painel-romano'];
          if(!p) throw new Error('RETANGULAR_MISSING');
          if(!roman) throw new Error('ROMAN_MISSING');
          if(d.config?.protectedRoots?.['retangular-1x2']!==root) throw new Error('RETANGULAR_ROOT_MISMATCH');
          if(String(p.label||'').toLowerCase()!=='painel retangular') throw new Error('RETANGULAR_LABEL_INVALID:'+p.label);
          if(p.catalogReady!==true) throw new Error('RETANGULAR_CATALOG_NOT_READY');
          if(p.size!=='1X2'||p.sizeKey!=='100x200') throw new Error('RETANGULAR_SIZE_CONFIG_INVALID');
          if(Number(p.quantity?.minimum)!==1 || Number(p.quantity?.step)!==1) throw new Error('RETANGULAR_QUANTITY_INVALID');
          if(Number(p.unitPrice)!==78 || p.enabled!==true) throw new Error('RETANGULAR_PRICE_INVALID:'+JSON.stringify({price:p.unitPrice,enabled:p.enabled}));
          if(Number(roman.unitPrice)!==78 || roman.enabled!==true) throw new Error('ROMAN_PRICE_INVALID:'+JSON.stringify({price:roman.unitPrice,enabled:roman.enabled}));
          console.log(JSON.stringify({rectangular:{label:p.label,price:p.unitPrice,enabled:p.enabled,size:p.size,sizeKey:p.sizeKey,root},roman:{label:roman.label,price:roman.unitPrice,enabled:roman.enabled}}));
          NODE

      - name: Validar identidade das artes quando existirem
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://new-hub-artres.pages.dev'
          node <<'NODE'
          const fs=require('node:fs');
          const themes=JSON.parse(fs.readFileSync('rect-themes.json','utf8'));
          fs.writeFileSync('art-count.txt',String(Number(themes.artworkTotal||0)));
          fs.writeFileSync('theme.txt',String(themes.folders?.[0]?.name||''));
          NODE
          COUNT=$(cat art-count.txt)
          if [ "$COUNT" = "0" ]; then
            echo 'Pasta do Painel Retangular está conectada e atualmente não contém artes indexáveis; teste de item será executado quando houver arquivos.'
            exit 0
          fi
          THEME=$(cat theme.txt)
          curl --fail --silent --show-error --get --max-time 45 "$BASE/api/painel-retangular" --data-urlencode 'mode=items' --data-urlencode "theme=$THEME" --data-urlencode "_ret_verify=$(date +%s)" -o rect-items.json
          node <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('rect-items.json','utf8'));
          if(d.ok!==true || !Array.isArray(d.items) || !d.items.length) throw new Error('RETANGULAR_ITEMS_EMPTY');
          for(const i of d.items.slice(0,20)){
            if(i.productKey!=='retangular-1x2') throw new Error('RETANGULAR_PRODUCT_KEY_INVALID');
            if(i.productName!=='Painel Retangular') throw new Error('RETANGULAR_PRODUCT_NAME_INVALID');
            if(i.sizeKey!=='100x200' || i.size!=='1X2') throw new Error('RETANGULAR_SIZE_INVALID');
            if(i.details?.fixed!==true) throw new Error('RETANGULAR_FIXED_INVALID');
          }
          console.log(JSON.stringify({theme:d.theme,total:d.total,sampleCode:d.items[0].code}));
          NODE

      - name: Validar endpoint de pedidos sem criar pedido
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://new-hub-artres.pages.dev'
          code=$(curl --silent --show-error --location --max-time 30 -o unified.json -w '%{http_code}' -X POST "$BASE/api/orders-unified" -H 'Content-Type: application/json' --data '{"items":[]}')
          test "$code" = '400'
          node <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync('unified.json','utf8'));
          if(body.error!=='CARRINHO_VAZIO_OU_INVALIDO') throw new Error('UNIFIED_ENDPOINT_INVALID');
          NODE

      - name: Validar aba e preços no navegador
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://new-hub-artres.pages.dev'
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then echo 'Chrome/Chromium não disponível no runner.' >&2; exit 1; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=16000 --dump-dom "$BASE/?produto=retangular-1x2&_ret_verify=$(date +%s)" > dom.html
          grep -q 'id="productionV2RetangularTab"' dom.html
          grep -q 'Painel Retangular' dom.html
          grep -q 'productionV2TabPrice' dom.html
          grep -q 'R$ 78,00' dom.html
          COUNT=$(cat art-count.txt)
          if [ "$COUNT" = "0" ]; then
            grep -q 'Nenhuma arte cadastrada ainda' dom.html
            if grep -q '0 tema(s)' dom.html; then echo 'Estado vazio genérico incorreto.' >&2; exit 1; fi
          fi
          echo 'Aba do Painel Retangular e preços foram renderizados corretamente no domínio oficial.'
