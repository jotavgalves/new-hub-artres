name: Hotfix Catalog V2 Live Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-catalog-v2-live.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch catalog-v2
        shell: python
        run: |
          from pathlib import Path

          path = Path('functions/api/catalog-v2.js')
          text = path.read_text(encoding='utf-8')

          old = """    if (accepted) return json(accepted, 200, 15);"""
          new = """    // O catálogo autenticado V2 é uma projeção e pode ficar alguns minutos atrás do Drive.
    // Para artes e busca, reconciliamos com as fontes atuais em vez de encerrar aqui.
    const acceptedAuthoritative = accepted && !['items', 'search', 'globalSearch'].includes(mode);
    if (acceptedAuthoritative) return json(accepted, 200, 15);"""
          if old not in text:
              raise SystemExit('PATTERN_ACCEPTED_NOT_FOUND')
          text = text.replace(old, new, 1)

          old = """  if (input.productKey !== 'painel-150') {
    return indexedItems.sort(sortItems);
  }

  const live = await liveFolderChildren(env, parentId, input.rootId);"""
          new = """  // Reconciliamos todas as linhas de produto com o Drive ao vivo. Antes isso só
  // acontecia para painel-150, deixando novas artes 50x50 invisíveis até a projeção atualizar.
  const live = await liveFolderChildren(env, parentId, input.rootId);"""
          if old not in text:
              raise SystemExit('PATTERN_ITEMS_LIVE_NOT_FOUND')
          text = text.replace(old, new, 1)

          old = """  return dedupeRows(out)
    .filter(row => String(row.root_drive_id || '') === input.rootId)
    .map(row => itemFromRow(row, input))
    .filter(Boolean)
    .sort((a, b) => scoreRow(b.__row || b, q) - scoreRow(a.__row || a, q) || sortItems(a, b))
    .slice(0, input.limit)
    .map(item => { delete item.__row; return item; });
}"""
          new = """  const indexedItems = dedupeRows(out)
    .filter(row => String(row.root_drive_id || '') === input.rootId)
    .map(row => itemFromRow(row, input))
    .filter(Boolean);

  const merged = indexedItems.slice();
  const seenIds = new Set(merged.map(item => String(item.id || '')));

  // Quando a projeção/índice ainda não conhece uma arte recém-cadastrada, procure o
  // código diretamente no Drive e valide que o arquivo realmente pertence a esta raiz.
  if (digits.length >= 2) {
    const liveFiles = await searchLiveDriveImagesByCode(env, digits, input.rootId, input.limit);
    for (const entry of liveFiles) {
      const liveItem = itemFromDriveFile(entry.file, input, entry.parentId);
      if (!liveItem || String(liveItem.code || '') !== digits) continue;
      const id = String(liveItem.id || '');
      if (!id || seenIds.has(id)) continue;
      seenIds.add(id);
      merged.push(liveItem);
    }
  }

  return merged
    .sort((a, b) => scoreRow(b.__row || b, q) - scoreRow(a.__row || a, q) || sortItems(a, b))
    .slice(0, input.limit)
    .map(item => { delete item.__row; return item; });
}"""
          if old not in text:
              raise SystemExit('PATTERN_SEARCH_RETURN_NOT_FOUND')
          text = text.replace(old, new, 1)

          marker = """async function searchFolders(env, query, config, productKey, rootId) {"""
          helper = r"""
async function searchLiveDriveImagesByCode(env, code, rootId, limit) {
  const key = driveApiKey(env);
  const digits = String(code || '').replace(/\D/g, '');
  if (!key || digits.length < 2) return [];

  const escaped = digits.replace(/'/g, "\\'");
  const params = new URLSearchParams({
    key,
    supportsAllDrives: 'true',
    includeItemsFromAllDrives: 'true',
    q: `trashed = false and name contains '${escaped}'`,
    fields: 'files(id,name,mimeType,webViewLink,modifiedTime,parents,trashed)',
    pageSize: '100'
  });
  const response = await fetch(`${DRIVE_API}?${params}`, { headers: { Accept: 'application/json' } });
  if (!response.ok) return [];

  const data = await response.json();
  const candidates = (Array.isArray(data.files) ? data.files : [])
    .filter(file => String(file.mimeType || '').startsWith('image/'))
    .filter(file => {
      const base = String(file.name || '').replace(/\.[^.]+$/, '').trim();
      const leading = base.match(/^\s*(\d{1,20})(?:[_\-\s]|$)/);
      const any = base.match(/\d+/);
      const parsed = String((leading && leading[1]) || (any && any[0]) || '');
      return parsed === digits;
    });

  const found = [];
  for (const file of candidates) {
    const parentId = String((Array.isArray(file.parents) && file.parents[0]) || '');
    if (!parentId || !(await folderWithinRoot(env, parentId, rootId))) continue;
    found.push({ file, parentId });
    if (found.length >= Math.min(Math.max(Number(limit) || 20, 1), 80)) break;
  }
  return found;
}

"""
          if marker not in text:
              raise SystemExit('PATTERN_SEARCH_FOLDER_MARKER_NOT_FOUND')
          text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate syntax
        run: node --check functions/api/catalog-v2.js

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- functions/api/catalog-v2.js; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/catalog-v2.js
          git commit -m 'Corrige publicação imediata de novas artes no catálogo V2'
          git push origin HEAD:main
