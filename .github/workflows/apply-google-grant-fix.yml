name: Corrigir grant type do Google

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-google-grant-fix.yml'
      - 'scripts/catalog-v2/apply-google-grant-fix.py'
      - 'scripts/catalog-v2/service-account-google-drive.mjs'
      - 'functions/api/catalog-image.js'
      - 'tests/catalog-v2/service-account-google-drive.test.mjs'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/google-service-account-grant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-service-account-grant
          fetch-depth: 0
      - name: Aplicar correção
        run: python scripts/catalog-v2/apply-google-grant-fix.py
      - name: Validar grant oficial e testes
        run: |
          set -euo pipefail
          node --check scripts/catalog-v2/service-account-google-drive.mjs
          node --check functions/api/catalog-image.js
          node --test tests/catalog-v2/service-account-google-drive.test.mjs
          ! grep -R "urn:ietf:params:oauth2:grant-type:jwt-bearer" scripts/catalog-v2/service-account-google-drive.mjs functions/api/catalog-image.js tests/catalog-v2/service-account-google-drive.test.mjs
          grep -R "urn:ietf:params:oauth:grant-type:jwt-bearer" scripts/catalog-v2/service-account-google-drive.mjs functions/api/catalog-image.js tests/catalog-v2/service-account-google-drive.test.mjs
      - name: Registrar correção
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Correção já aplicada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/catalog-v2/service-account-google-drive.mjs functions/api/catalog-image.js tests/catalog-v2/service-account-google-drive.test.mjs
          git commit -m 'Corrige grant type JWT da conta de serviço'
          git push origin HEAD:fix/google-service-account-grant
