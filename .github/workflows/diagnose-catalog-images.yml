name: Verificar imagens do catálogo

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-catalog-images.yml'
      - 'functions/api/catalog-v2.js'
      - 'functions/api/_catalog_index.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-catalog-images.yml'
      - 'functions/api/catalog-v2.js'
      - 'functions/api/_catalog_index.js'

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar preservação dos IDs do Drive
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/api/catalog-v2.js
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('functions/api/catalog-v2.js', 'utf8');
          if (!source.includes("const folderId = catalogFolderId(url.searchParams.get('folderId'), rootId);")) throw new Error('CATALOG_FOLDER_ID_NOT_PRESERVED');
          if (!source.includes("if (text.startsWith('catalog-v2-product:')) return text;")) throw new Error('VIRTUAL_PRODUCT_ID_NOT_PRESERVED');
          if (source.includes("const folderId = cleanLabel(url.searchParams.get('folderId') || rootId);")) throw new Error('OPAQUE_ID_STILL_NORMALIZED_AS_LABEL');
          NODE

  production:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aguardar publicação e validar imagens reais
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if node <<'NODE'
          const BASE = 'https://new-hub-artres.pages.dev';

          async function get(path) {
            const r = await fetch(BASE + path, { headers: { accept: 'application/json' } });
            const text = await r.text();
            let data;
            try { data = JSON.parse(text); } catch { throw new Error(`JSON_INVALID ${path} ${r.status}`); }
            if (!r.ok || data.ok === false) throw new Error(`HTTP_${r.status}_${data.error || 'UNKNOWN'}`);
            return data;
          }

          async function findItems(product) {
            const themes = await get(`/api/catalog-v2?mode=themes&product=${encodeURIComponent(product)}&_verify=${Date.now()}`);
            for (const theme of (themes.folders || []).slice(0, 180)) {
              const products = await get(`/api/catalog-v2?mode=products&product=${encodeURIComponent(product)}&folderId=${encodeURIComponent(theme.id)}&theme=${encodeURIComponent(theme.name || '')}&_verify=${Date.now()}`);
              for (const folder of (products.folders || [])) {
                const items = await get(`/api/catalog-v2?mode=items&product=${encodeURIComponent(product)}&folderId=${encodeURIComponent(folder.id)}&theme=${encodeURIComponent(theme.name || '')}&_verify=${Date.now()}`);
                if (Array.isArray(items.items) && items.items.length) return { theme, items };
              }
            }
            throw new Error(`NO_ITEMS_FOUND_${product}`);
          }

          for (const product of ['50x50', 'painel-150']) {
            const found = await findItems(product);
            const item = found.items.items[0];
            if (!item?.id || !item?.image) throw new Error(`ITEM_WITHOUT_IMAGE_${product}`);
            const image = await fetch(item.image, { redirect: 'follow' });
            const type = image.headers.get('content-type') || '';
            if (!image.ok) throw new Error(`IMAGE_HTTP_${image.status}_${product}`);
            if (!type.startsWith('image/')) throw new Error(`IMAGE_CONTENT_TYPE_${product}_${type}`);
            console.log(JSON.stringify({ product, theme: found.theme.name, total: found.items.total, imageStatus: image.status, contentType: type }));
          }
          NODE
            then
              echo "Catálogos e imagens validados na tentativa $attempt."
              exit 0
            fi
            echo "Aguardando a versão corrigida no Pages: tentativa $attempt/30"
            sleep 10
          done
          echo 'O catálogo oficial não apresentou imagens válidas dentro do prazo.' >&2
          exit 1
