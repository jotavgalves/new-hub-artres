name: Diagnosticar imagens do catálogo

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-catalog-images.yml'
      - 'assets/production-v2.js'
      - 'assets/production-v2-compat.js'
      - 'functions/api/catalog-v2.js'
      - 'functions/api/_catalog_index.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Percorrer catálogo corrigido até as imagens
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const BASE = 'https://186e9642.new-hub-artres.pages.dev';

          async function get(path) {
            const r = await fetch(BASE + path, { headers: { accept: 'application/json' } });
            const text = await r.text();
            let data;
            try { data = JSON.parse(text); } catch { throw new Error(`JSON_INVALID ${path} ${r.status} ${text.slice(0,200)}`); }
            if (!r.ok || data.ok === false) throw new Error(`HTTP_${r.status} ${path} ${JSON.stringify(data).slice(0,400)}`);
            return data;
          }

          async function findItems(product) {
            const themes = await get(`/api/catalog-v2?mode=themes&product=${encodeURIComponent(product)}&_diag=${Date.now()}`);
            for (const theme of (themes.folders || []).slice(0, 160)) {
              const products = await get(`/api/catalog-v2?mode=products&product=${encodeURIComponent(product)}&folderId=${encodeURIComponent(theme.id)}&theme=${encodeURIComponent(theme.name || '')}&_diag=${Date.now()}`);
              for (const folder of (products.folders || [])) {
                const items = await get(`/api/catalog-v2?mode=items&product=${encodeURIComponent(product)}&folderId=${encodeURIComponent(folder.id)}&theme=${encodeURIComponent(theme.name || '')}&_diag=${Date.now()}`);
                if (Array.isArray(items.items) && items.items.length) return { theme, folder, payload: items };
              }
            }
            return null;
          }

          for (const product of ['50x50','painel-150']) {
            const found = await findItems(product);
            if (!found) throw new Error(`NO_ITEMS_FOUND_${product}`);
            const item = found.payload.items[0];
            console.log('FOUND', product, found.theme.name, found.payload.total, item.id, item.image);
            if (!item.id || !item.image) throw new Error(`ITEM_WITHOUT_IMAGE_${product}_${JSON.stringify(item)}`);
            const image = await fetch(item.image, { redirect: 'follow' });
            const type = image.headers.get('content-type') || '';
            console.log('IMAGE_FETCH', product, image.status, type, image.url);
            if (!image.ok) throw new Error(`IMAGE_HTTP_${image.status}_${product}`);
            if (!type.startsWith('image/')) throw new Error(`IMAGE_CONTENT_TYPE_${product}_${type}`);
          }
          NODE
