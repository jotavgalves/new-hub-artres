name: Finalizar remoção do teto PED

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/remove-ped-sequence-cap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-ped-sequence-cap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar alterações restantes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          function replace(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before) && !source.includes(after)) throw new Error(`PADRAO_NAO_ENCONTRADO:${path}`);
            fs.writeFileSync(path, source.split(before).join(after));
          }
          replace('staging/site-v2-worker/src/order-ledger-do.js', "return /^PED\\d{2}\\d{5}[A-Z]$/.test(normalized) ? normalized : '';", "return /^PED\\d{2}\\d{5}[A-Z]+$/.test(normalized) ? normalized : '';");
          replace('supabase/contracts/order-projection-v1.schema.json', '"pattern": "^PED[0-9]{7}[A-Z]$"', '"pattern": "^PED[0-9]{7}[A-Z]+$"');
          replace('supabase/migrations/20260727193000_armazem_v2_projection_foundation.sql', '^PED[0-9]{7}[A-Z]$', '^PED[0-9]{7}[A-Z]+$');
          NODE

          cat > supabase/migrations/20260805073000_remove_ped_annual_capacity.sql <<'SQL'
          begin;
          alter table armazem_v2_private.orders drop constraint if exists armazem_v2_orders_number_format;
          alter table armazem_v2_private.orders add constraint armazem_v2_orders_number_format check (order_number ~ '^PED[0-9]{7}[A-Z]+$');
          do $$
          declare v_definition text; v_updated text;
          begin
            select pg_get_functiondef(p.oid) into v_definition
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public' and p.proname = 'armazem_v2_project_order_v1' limit 1;
            if v_definition is null then raise exception 'ARMAZEM_V2_PROJECT_ORDER_FUNCTION_MISSING'; end if;
            v_updated := replace(v_definition, '''^PED[0-9]{7}[A-Z]$''', '''^PED[0-9]{7}[A-Z]+$''');
            if v_updated <> v_definition then execute v_updated; end if;
          end $$;
          commit;
          SQL

          cat > tests/v2/order-number-unbounded.test.mjs <<'TEST'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';
          import { formatOrderNumberV2, parseOrderNumberV2 } from '../../src/v2/orders/order-number.mjs';
          const ROOT = new URL('../../', import.meta.url);
          const read = path => readFile(new URL(path, ROOT), 'utf8');
          async function production() {
            const source = await read('functions/api/_order_numbers.js');
            return import(`data:text/javascript;base64,${Buffer.from(source).toString('base64')}#${Date.now()}`);
          }
          test('PED continua após Z com AA, AB e AAA', async () => {
            const current = await production();
            for (const [sequence, expected] of [[1,'PED2600001A'],[260000,'PED2610000Z'],[260001,'PED2600001AA'],[270001,'PED2600001AB'],[7020001,'PED2600001AAA']]) {
              assert.equal(current.formatOrderNumber('26', sequence), expected);
              assert.equal(current.parseOrderNumber(expected)?.sequence, sequence);
              assert.equal(formatOrderNumberV2('2026-08-05T10:00:00.000Z', sequence), expected);
              assert.equal(parseOrderNumberV2(expected)?.sequence, sequence);
            }
          });
          test('nenhuma camada mantém o teto de uma letra', async () => {
            for (const path of ['src/v2/orders/order-number.mjs','staging/site-v2-worker/src/order-ledger-do.js','supabase/contracts/order-projection-v1.schema.json','supabase/migrations/20260727193000_armazem_v2_projection_foundation.sql','supabase/migrations/20260805073000_remove_ped_annual_capacity.sql']) {
              const source = await read(path);
              assert.doesNotMatch(source, /ORDER_SEQUENCE_CAPACITY_EXCEEDED/);
              assert.doesNotMatch(source, /\[A-Z\]\$/);
            }
          });
          TEST

          rm -f .github/workflows/apply-ped-cap-patch.yml .github/workflows/apply-ped-cap-patch-pr.yml
          node --test tests/v2/order-number-unbounded.test.mjs tests/v2/checkout-return-and-order-number-safety.test.mjs
      - name: Commitar no branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove limite estrutural da sequência PED'
          git push origin HEAD:agent/remove-ped-sequence-cap
