name: Aplicar hotfix do Painel 150

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-panel-themes.yml'
      - 'scripts/patch-panel-drive-shared-flags.py'
      - 'functions/api/catalog-v2.js'

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.head_ref == 'fix/panel-drive-shared-flags'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/panel-drive-shared-flags
          fetch-depth: 0
      - name: Aplicar fallback e suporte a Shared Drive
        run: python scripts/patch-panel-drive-shared-flags.py
      - name: Validar sintaxe e contrato
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/api/catalog-v2.js
          grep -Fq "if (!Array.isArray(live) || live.length === 0) return indexed;" functions/api/catalog-v2.js
          grep -Fq "supportsAllDrives: 'true'" functions/api/catalog-v2.js
          grep -Fq "includeItemsFromAllDrives: 'true'" functions/api/catalog-v2.js
          grep -Fq "function internalCatalogName" functions/api/catalog-v2.js
      - name: Registrar alteração na branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Hotfix já estava aplicado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/catalog-v2.js
          git commit -m 'Corrige fallback e Shared Drive do Painel 150'
          git push origin HEAD:fix/panel-drive-shared-flags
