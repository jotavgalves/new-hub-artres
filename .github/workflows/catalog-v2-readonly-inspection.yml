name: Inspecionar Catálogo V2 Somente Leitura

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/catalog-v2-readonly-inspection.yml'
      - '.github/workflows/site-v2-baseline.yml'
      - 'scripts/catalog-v2/**'
      - 'tests/catalog-v2/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-v2-readonly-inspection
  cancel-in-progress: false

jobs:
  inspect-readonly-catalog:
    name: Validar e aceitar catálogo V2 no staging
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[catalog-readonly-inspection]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: site-v2-staging

    env:
      SITE_V2_STAGING_API_TOKEN: ${{ secrets.SITE_V2_STAGING_API_TOKEN }}
      STAGING_URL: https://new-hub-artres-v2-staging.jvgacontato.workers.dev
      CATALOG_LEGACY_BASE_URL: https://new-hub-artres.pages.dev
      CATALOG_V2_ROOT_DRIVE_ID: 193kW8g7EsmrNwlGE3ugbC3qzOcDEwUae
      CATALOG_REPORT_FILE: /tmp/catalog-v2-readonly-inspection-report.json
      CATALOG_ACCEPTED_STATE_FILE: config/catalog-v2-accepted-version.json
      CATALOG_INSPECTION_MAX_REQUESTS: '2000'
      CATALOG_INSPECTION_MAX_FOLDERS: '2000'
      CATALOG_INSPECTION_MAX_ARTWORKS: '100000'
      TRACKING_ISSUE_NUMBER: '16'

    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validar token de verificação do staging
        run: |
          set -euo pipefail
          if [ -z "$SITE_V2_STAGING_API_TOKEN" ]; then
            echo "Segredo obrigatório ausente: SITE_V2_STAGING_API_TOKEN"
            exit 1
          fi

      - name: Executar testes defensivos
        run: node --test tests/v2/*.test.mjs tests/catalog-v2/*.test.mjs

      - name: Confirmar ponte desativada antes da leitura
        id: verify_disabled_before
        run: node scripts/catalog-v2/verify-staging-catalog-bridge-disabled.mjs

      - name: Ler catálogo público e validar contrato V2 localmente
        id: inspect_catalog
        run: node scripts/catalog-v2/run-catalog-v2-local-readonly-inspection.mjs

      - name: Aceitar versão validada no staging
        id: accept_catalog
        run: node scripts/catalog-v2/accept-validated-catalog-version.mjs

      - name: Persistir nova versão aceita
        if: steps.accept_catalog.outputs.changed == 'true'
        env:
          ACCEPTED_VERSION: ${{ steps.accept_catalog.outputs.accepted_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CATALOG_ACCEPTED_STATE_FILE"
          git commit -m "Aceita catálogo V2 versão ${ACCEPTED_VERSION} no staging"
          git push origin HEAD:main

      - name: Anexar relatório sanitizado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-v2-readonly-inspection-report
          path: ${{ env.CATALOG_REPORT_FILE }}
          retention-days: 1
          if-no-files-found: ignore

      - name: Confirmar ponte continua desativada
        id: verify_disabled_after
        if: always()
        run: node scripts/catalog-v2/verify-staging-catalog-bridge-disabled.mjs

      - name: Registrar resultado sanitizado na issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSPECTION_OUTCOME: ${{ steps.inspect_catalog.outcome }}
          DEACTIVATION_OUTCOME: skipped
          VERIFY_OUTCOME: ${{ steps.verify_disabled_after.outcome }}
          ROLLBACK_OUTCOME: skipped
        run: node scripts/catalog-v2/post-catalog-inspection-status.mjs

      - name: Remover relatório temporário
        if: always()
        run: rm -f "$CATALOG_REPORT_FILE"
