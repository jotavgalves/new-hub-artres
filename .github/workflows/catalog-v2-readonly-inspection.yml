name: Inspecionar Catálogo V2 Somente Leitura

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/catalog-v2-readonly-inspection.yml'
      - '.github/workflows/site-v2-baseline.yml'
      - 'scripts/catalog-v2/**'
      - 'tests/catalog-v2/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-v2-readonly-inspection
  cancel-in-progress: false

jobs:
  inspect-readonly-catalog:
    name: Ativar, comparar e desativar ponte somente leitura
    if: contains(github.event.head_commit.message, '[catalog-readonly-inspection]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: site-v2-staging

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_V2_STAGING_API_TOKEN: ${{ secrets.SITE_V2_STAGING_API_TOKEN }}
      SUPABASE_V2_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_V2_STAGING_SERVICE_ROLE_KEY }}
      STAGING_URL: https://new-hub-artres-v2-staging.jvgacontato.workers.dev
      CATALOG_LEGACY_BASE_URL: https://new-hub-artres.pages.dev
      CATALOG_V2_ROOT_DRIVE_ID: 193kW8g7EsmrNwlGE3ugbC3qzOcDEwUae
      CATALOG_ACTIVE_CONFIG_FILE: wrangler.catalog-readonly-active.runtime.jsonc
      CATALOG_SAFE_CONFIG_FILE: wrangler.catalog-readonly-safe.runtime.jsonc
      ROLLBACK_CONFIG_FILE: wrangler.catalog-readonly-emergency-rollback.runtime.jsonc
      STAGING_SECRETS_FILE: /tmp/catalog-readonly-staging-secrets.json
      CATALOG_REPORT_FILE: /tmp/catalog-v2-readonly-inspection-report.json
      CATALOG_INSPECTION_MAX_REQUESTS: '1600'
      CATALOG_INSPECTION_MAX_FOLDERS: '800'
      CATALOG_INSPECTION_MAX_ARTWORKS: '100000'
      TRACKING_ISSUE_NUMBER: '16'

    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validar segredos obrigatórios
        run: |
          set -euo pipefail
          missing=0
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SITE_V2_STAGING_API_TOKEN SUPABASE_V2_STAGING_SERVICE_ROLE_KEY; do
            if [ -z "${!variable}" ]; then
              echo "Segredo obrigatório ausente: $variable"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Executar testes defensivos
        run: node --test tests/v2/*.test.mjs tests/catalog-v2/*.test.mjs

      - name: Preparar secrets e rollback emergencial
        run: |
          set -euo pipefail
          umask 077
          node scripts/v2/prepare-site-v2-staging-deploy.mjs

      - name: Preparar configurações temporária e segura
        run: node scripts/catalog-v2/prepare-catalog-readonly-inspection.mjs

      - name: Validar bundles sem publicar
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 deploy --dry-run --strict \
            --config "$CATALOG_ACTIVE_CONFIG_FILE" \
            --secrets-file "$STAGING_SECRETS_FILE" \
            --outdir /tmp/catalog-readonly-active-dry-run
          npx --yes wrangler@4.114.0 deploy --dry-run --strict \
            --config "$CATALOG_SAFE_CONFIG_FILE" \
            --secrets-file "$STAGING_SECRETS_FILE" \
            --outdir /tmp/catalog-readonly-safe-dry-run
          npx --yes wrangler@4.114.0 deploy --dry-run --strict \
            --config "$ROLLBACK_CONFIG_FILE" \
            --secrets-file "$STAGING_SECRETS_FILE" \
            --outdir /tmp/catalog-readonly-emergency-dry-run

      - name: Ativar ponte somente leitura temporariamente
        id: deploy_active
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --strict
          --config "$CATALOG_ACTIVE_CONFIG_FILE"
          --secrets-file "$STAGING_SECRETS_FILE"
          --message "Inspeção temporária do catálogo V2 somente leitura"
          --tag "catalog-v2-readonly-temporary-inspection"

      - name: Percorrer e comparar catálogo real
        id: inspect_catalog
        run: node scripts/catalog-v2/run-staging-catalog-readonly-inspection.mjs

      - name: Anexar relatório sanitizado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-v2-readonly-inspection-report
          path: ${{ env.CATALOG_REPORT_FILE }}
          retention-days: 1
          if-no-files-found: ignore

      - name: Desativar ponte e remover origem do runtime
        id: deactivate
        if: always() && steps.deploy_active.outcome == 'success'
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --strict
          --config "$CATALOG_SAFE_CONFIG_FILE"
          --secrets-file "$STAGING_SECRETS_FILE"
          --message "Inspeção concluída: ponte de catálogo desativada"
          --tag "catalog-v2-readonly-disabled-after-inspection"

      - name: Confirmar ponte desativada
        id: verify_disabled
        if: always() && steps.deactivate.outcome == 'success'
        run: node scripts/catalog-v2/verify-staging-catalog-bridge-disabled.mjs

      - name: Executar rollback emergencial
        id: emergency_rollback
        if: always() && steps.deploy_active.outcome == 'success' && (steps.deactivate.outcome != 'success' || steps.verify_disabled.outcome != 'success')
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --strict
          --config "$ROLLBACK_CONFIG_FILE"
          --secrets-file "$STAGING_SECRETS_FILE"
          --message "Rollback emergencial da inspeção do catálogo"
          --tag "catalog-v2-readonly-emergency-rollback"

      - name: Registrar resultado sanitizado na issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSPECTION_OUTCOME: ${{ steps.inspect_catalog.outcome }}
          DEACTIVATION_OUTCOME: ${{ steps.deactivate.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_disabled.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.emergency_rollback.outcome }}
        run: node scripts/catalog-v2/post-catalog-inspection-status.mjs

      - name: Remover arquivos temporários
        if: always()
        run: >-
          rm -f
          "$STAGING_SECRETS_FILE"
          "$CATALOG_ACTIVE_CONFIG_FILE"
          "$CATALOG_SAFE_CONFIG_FILE"
          "$ROLLBACK_CONFIG_FILE"
          "$CATALOG_REPORT_FILE"
