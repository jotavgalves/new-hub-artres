name: Site V2 Baseline

on:
  pull_request:
    paths:
      - 'src/v2/**'
      - 'scripts/v2/**'
      - 'staging/site-v2-worker/**'
      - 'supabase/**'
      - 'tests/v2/**'
      - 'docs/**'
      - 'wrangler.site-v2-staging.jsonc'
      - '.github/workflows/site-v2-baseline.yml'
      - '.github/workflows/deploy-site-v2-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  defensive-foundation:
    name: Contratos, isolamento e staging dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DRY_RUN_SECRETS_FILE: /tmp/site-v2-staging-dry-run-secrets.json

    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Executar testes isolados da V2
        id: node-tests
        run: |
          set -euo pipefail
          TEST_LOG=/tmp/site-v2-node-tests.log
          if ! node --test tests/v2/*.test.mjs > "$TEST_LOG" 2>&1; then
            echo "Falha nos testes V2. Últimas 220 linhas:"
            tail -n 220 "$TEST_LOG"
            exit 1
          fi
          tail -n 30 "$TEST_LOG"

      - name: Anexar diagnóstico dos testes em caso de falha
        if: failure() && steps.node-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-v2-node-test-failure
          path: /tmp/site-v2-node-tests.log
          retention-days: 1
          if-no-files-found: error

      - name: Verificar sintaxe do Worker, persistência e deploy V2
        run: |
          node --check src/v2/persistence/supabase-rpc-client.mjs
          node --check src/v2/persistence/supabase-order-projection.mjs
          node --check scripts/v2/prepare-site-v2-staging-deploy.mjs
          node --check staging/site-v2-worker/src/index.js
          node --check staging/site-v2-worker/src/index-shadow.js
          node --check staging/site-v2-worker/src/supabase-shadow-projector.js
          node --check staging/site-v2-worker/src/order-ledger-do.js
          node --check staging/site-v2-worker/src/admin-readonly-page.js
          node --check tests/v2/run-staging-supabase-shadow-remote-smoke.mjs

      - name: Preparar secret sintético do dry-run
        run: |
          umask 077
          printf '%s' '{"STAGING_API_TOKEN":"ci-dry-run-token-0123456789abcdef"}' > "$DRY_RUN_SECRETS_FILE"

      - name: Validar bundle Cloudflare sem publicar
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --dry-run
          --strict
          --config wrangler.site-v2-staging.jsonc
          --secrets-file "$DRY_RUN_SECRETS_FILE"
          --outdir /tmp/site-v2-staging-dry-run

      - name: Remover secret sintético do dry-run
        if: always()
        run: rm -f "$DRY_RUN_SECRETS_FILE"

      - name: Executar Worker e Durable Object localmente
        run: bash tests/v2/run-staging-worker-smoke.sh

      - name: Validar painel administrativo somente leitura
        run: bash tests/v2/run-staging-admin-readonly-smoke.sh
