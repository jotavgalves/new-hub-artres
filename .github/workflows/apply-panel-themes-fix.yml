name: Aplicar correção dos temas do Painel 150

on:
  push:
    branches: [fix/panel-themes-cleanup]
    paths:
      - '.github/workflows/apply-panel-themes-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/panel-themes-cleanup
          fetch-depth: 0
      - name: Usar o Drive atual como autoridade do Painel 150
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('functions/api/catalog-v2.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "const MAX_ROWS = 5000;",
              "const MAX_ROWS = 5000;\nconst DRIVE_API = 'https://www.googleapis.com/drive/v3/files';\nconst FOLDER_MIME = 'application/vnd.google-apps.folder';",
              1
          )

          theme_fn = r'''async function themeFolders(env, config, productKey, rootId) {
  const rows = await allRows(env, params => {
    params.set('type', 'eq.folder');
    params.set('root_drive_id', 'eq.' + rootId);
    params.set('parent_drive_id', 'eq.' + rootId);
  });
  const indexedFolders = dedupeRows(rows)
    .map(row => folderFromRow(row, config, 'theme', productKey, rootId))
    .map(folder => applyFolderRule(folder, config, 'theme'))
    .filter(folder => isPublicCatalogFolder(folder, config));

  const liveFolders = productKey === 'painel-150'
    ? await liveThemeFolders(env, config, productKey, rootId)
    : [];
  const folders = liveFolders.length ? liveFolders : indexedFolders;
  sortFolders(folders);
  return folders;
}'''
          text, count = re.subn(
              r"async function themeFolders\(env, config, productKey, rootId\) \{.*?\n\}\n\nasync function productFolders",
              theme_fn + "\n\nasync function productFolders",
              text,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('THEME_FUNCTION_NOT_REPLACED')

          product_fn = r'''async function productFolders(env, input) {
  const { folderId, theme, config, productKey, rootId, commercial } = input;
  const childRows = await allRows(env, params => {
    params.set('type', 'eq.folder');
    params.set('root_drive_id', 'eq.' + rootId);
    params.set('parent_drive_id', 'eq.' + folderId);
  });
  const indexedCards = dedupeRows(childRows)
    .map(row => folderFromRow(row, config, 'folder', productKey, rootId))
    .map(folder => applyFolderRule(folder, config, 'subtheme'))
    .filter(folder => isPublicCatalogFolder(folder, config));

  const live = productKey === 'painel-150'
    ? await liveChildrenForFolder(env, folderId, rootId)
    : null;
  const liveCards = live
    ? live.folders
        .map(file => folderFromDrive(file, config, 'folder', productKey, rootId, folderId))
        .map(folder => applyFolderRule(folder, config, 'subtheme'))
        .filter(folder => isPublicCatalogFolder(folder, config))
    : [];
  const folderCards = mergeById(indexedCards, liveCards);
  sortFolders(folderCards);

  const artRows = await artworkRowsByParent(env, folderId, rootId);
  const hasArtwork = artRows.length > 0 || Boolean(live && live.images.length);
  const products = hasArtwork ? [productCard(folderId, theme, productKey, rootId, commercial)] : [];
  return folderCards.concat(products);
}'''
          text, count = re.subn(
              r"async function productFolders\(env, input\) \{.*?\n\}\n\nasync function itemRows",
              product_fn + "\n\nasync function itemRows",
              text,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('PRODUCT_FUNCTION_NOT_REPLACED')

          item_fn = r'''async function itemRows(env, input) {
  const parsed = parseVirtualProductId(input.folderId);
  const parentId = parsed ? parsed.parentId : input.folderId;
  const rows = await artworkRowsByParent(env, parentId, input.rootId);
  const indexedItems = rows
    .map(row => itemFromRow(row, input))
    .filter(Boolean);

  const live = input.productKey === 'painel-150'
    ? await liveChildrenForFolder(env, parentId, input.rootId)
    : null;
  const liveItems = live
    ? live.images.map(file => itemFromDriveFile(file, input, parentId)).filter(Boolean)
    : [];

  return mergeById(liveItems, indexedItems)
    .sort((a, b) => (Number(b.sortId) || 0) - (Number(a.sortId) || 0));
}'''
          text, count = re.subn(
              r"async function itemRows\(env, input\) \{.*?\n\}\n\nasync function searchItems",
              item_fn + "\n\nasync function searchItems",
              text,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('ITEM_FUNCTION_NOT_REPLACED')

          search_fn = r'''async function searchFolders(env, query, config, productKey, rootId) {
  const normalized = cleanLike(query);
  const rows = await limitedRows(env, params => {
    params.set('type', 'eq.folder');
    params.set('root_drive_id', 'eq.' + rootId);
    params.set('search_text', 'ilike.*' + normalized + '*');
  }, 120);
  const indexed = dedupeRows(rows)
    .filter(row => String(row.root_drive_id || '') === rootId)
    .map(row => folderResultFromRow(row, config, productKey, rootId))
    .filter(folder => isPublicCatalogFolder(folder, config));
  const live = productKey === 'painel-150'
    ? (await liveThemeFolders(env, config, productKey, rootId))
        .filter(folder => norm(folder.name).includes(norm(query)))
    : [];
  return mergeById(indexed, live)
    .sort((a, b) => String(a.path || a.name).localeCompare(String(b.path || b.name), 'pt-BR', { numeric: true }))
    .slice(0, 60);
}'''
          text, count = re.subn(
              r"async function searchFolders\(env, query, config, productKey, rootId\) \{.*?\n\}\n\nasync function artworkRowsByParent",
              search_fn + "\n\nasync function artworkRowsByParent",
              text,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('SEARCH_FUNCTION_NOT_REPLACED')

          helper_marker = "function productCard(parentId, theme, productKey, rootId, commercial) {"
          helpers = r'''function isPublicCatalogFolder(folder, config) {
  const name = String(folder && (folder.rawName || folder.name) || '');
  return !isInternalCatalogName(name) && !folder.hidden && !isHiddenTheme(folder.name, config) && !isHiddenTheme(folder.theme, config);
}

function isInternalCatalogName(value) {
  const name = norm(value);
  return /^codex\s+test(?:e)?(?:\s|$)/.test(name);
}

async function liveThemeFolders(env, config, productKey, rootId) {
  try {
    const files = await listDriveChildren(env, rootId);
    if (!files) return [];
    return files
      .filter(file => file.mimeType === FOLDER_MIME && !isInternalCatalogName(file.name))
      .map(file => folderFromDrive(file, config, 'theme', productKey, rootId, rootId))
      .map(folder => applyFolderRule(folder, config, 'theme'))
      .filter(folder => isPublicCatalogFolder(folder, config));
  } catch (_) {
    return [];
  }
}

async function liveChildrenForFolder(env, folderId, rootId) {
  try {
    if (!(await driveFolderWithinRoot(env, folderId, rootId))) return null;
    const files = await listDriveChildren(env, folderId);
    if (!files) return null;
    return {
      folders: files.filter(file => file.mimeType === FOLDER_MIME && !isInternalCatalogName(file.name)),
      images: files.filter(file => String(file.mimeType || '').startsWith('image/'))
    };
  } catch (_) {
    return null;
  }
}

async function driveFolderWithinRoot(env, folderId, rootId) {
  if (!folderId || !rootId) return false;
  if (folderId === rootId) return true;
  let current = folderId;
  const seen = new Set();
  for (let depth = 0; depth < 10; depth += 1) {
    if (!current || seen.has(current)) return false;
    seen.add(current);
    const file = await getDriveFile(env, current);
    if (!file || file.trashed || file.mimeType !== FOLDER_MIME) return false;
    const parents = Array.isArray(file.parents) ? file.parents : [];
    if (parents.includes(rootId)) return true;
    current = parents[0] || '';
  }
  return false;
}

async function getDriveFile(env, fileId) {
  const key = driveApiKey(env);
  if (!key) return null;
  const params = new URLSearchParams({
    key,
    fields: 'id,name,mimeType,parents,trashed'
  });
  const response = await fetch(`${DRIVE_API}/${encodeURIComponent(fileId)}?${params.toString()}`, {
    headers: { Accept: 'application/json' }
  });
  if (!response.ok) return null;
  return response.json();
}

async function listDriveChildren(env, folderId) {
  const key = driveApiKey(env);
  if (!key || !/^[A-Za-z0-9_-]{10,200}$/.test(String(folderId || ''))) return null;
  const out = [];
  let pageToken = '';
  do {
    const params = new URLSearchParams({
      key,
      q: `'${folderId}' in parents and trashed = false`,
      fields: 'nextPageToken,files(id,name,mimeType,webViewLink,modifiedTime,parents,trashed)',
      pageSize: '1000',
      orderBy: 'folder,name_natural'
    });
    if (pageToken) params.set('pageToken', pageToken);
    const response = await fetch(`${DRIVE_API}?${params.toString()}`, {
      headers: { Accept: 'application/json' }
    });
    if (!response.ok) return null;
    const data = await response.json();
    out.push(...(Array.isArray(data.files) ? data.files : []));
    pageToken = String(data.nextPageToken || '');
  } while (pageToken);
  return out;
}

function driveApiKey(env) {
  return String(env && (env.GOOGLE_API_KEY || env.GOOGLE_DRIVE_API_KEY || env.DRIVE_API_KEY) || '').trim();
}

function folderFromDrive(file, config, kind, productKey, rootId, parentId) {
  const raw = cleanLabel(file.name || 'Pasta');
  const name = displayTheme(raw, config);
  return {
    id: file.id || '',
    parentId: parentId || '',
    name,
    rawName: raw,
    label: name,
    kind,
    type: 'folder',
    path: name,
    theme: name,
    themeId: kind === 'theme' ? file.id : parentId,
    product: productKey,
    productKey,
    catalogRootDriveId: rootId,
    rootVerified: true,
    liveDrive: true
  };
}

function itemFromDriveFile(file, input, parentId) {
  const base = String(file.name || '').replace(/\.[^.]+$/, '').trim();
  const leading = base.match(/^\s*(\d{1,20})(?:[_\-\s]|$)/);
  const anyDigits = base.match(/\d+/);
  const code = String(leading && leading[1] || anyDigits && anyDigits[0] || file.id || '').trim();
  if (!code || isBlockedArt(code, input.config)) return null;
  const theme = displayTheme(input.theme || 'Sem tema', input.config);
  if (isHiddenTheme(theme, input.config) || isInternalCatalogName(theme)) return null;
  const image = `https://drive.google.com/thumbnail?id=${encodeURIComponent(file.id)}&sz=w1200`;
  const size = input.productKey === 'painel-150' ? '150X150' : '50X50';
  return {
    id: file.id,
    code,
    sortId: Number(code) || 0,
    theme,
    themeId: parentId,
    product: input.productKey,
    productKey: input.productKey,
    productName: input.commercial.label,
    productLabel: input.commercial.label,
    productFolderId: parentId,
    catalogRootDriveId: input.rootId,
    rootVerified: true,
    liveDrive: true,
    originalName: file.name || '',
    driveFileId: file.id,
    driveUrl: file.webViewLink || `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/view`,
    image,
    thumbnail: image,
    unitPrice: input.commercial.unitPrice,
    price: input.commercial.unitPrice,
    size,
    sizeKey: size,
    details: { size }
  };
}

function mergeById(primary, secondary) {
  const map = new Map();
  for (const item of [...(primary || []), ...(secondary || [])]) {
    const id = String(item && item.id || '');
    if (id) map.set(id, item);
  }
  return [...map.values()];
}

'''
          if 'async function liveThemeFolders' not in text:
              if helper_marker not in text:
                  raise SystemExit('HELPER_MARKER_NOT_FOUND')
              text = text.replace(helper_marker, helpers + helper_marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check functions/api/catalog-v2.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/catalog-v2.js
          git commit -m 'Usa Drive atual no catálogo do Painel 150'
          git push origin HEAD:fix/panel-themes-cleanup
