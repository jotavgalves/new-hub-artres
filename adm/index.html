<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Hub de Artes</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="shortcut icon" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/admin.css?v=4" />
  <style id="adminBrandFaviconStyle">
    .brandMark,
    .loginMark{
      background:#fff url('/assets/favicon.svg') center/78% no-repeat!important;
      border:1px solid rgba(238,225,227,.95)!important;
      box-shadow:0 12px 24px rgba(31,27,35,.08)!important;
    }
  </style>
</head>
<body>
  <section id="loginView" class="loginPage hidden">
    <form id="loginForm" class="loginCard" autocomplete="on">
      <div class="loginMark"></div>
      <h1 id="loginTitle">Painel administrativo</h1>
      <p id="loginSubtitle">Entre com seu usuário e senha.</p>
      <div id="loginStatus" class="status hidden"></div>
      <div class="field"><label>Usuário</label><input id="username" name="username" autocomplete="username" placeholder="Digite seu usuário"></div>
      <div class="field"><label>Senha</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha"></div>
      <div style="height:14px"></div><button class="btn primary full" type="submit">Entrar</button>
    </form>
  </section>

  <section id="adminView" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><div class="brandMark" aria-hidden="true"></div><div><h1>Armazém Admin</h1><p>Painel de controle</p></div></div>
      <nav class="nav" aria-label="Menu administrativo">
        <button class="active" data-tab="overviewView">Visão geral <small>01</small></button>
        <button data-tab="ordersView">Pedidos <small>02</small></button>
        <button data-tab="sellersView">Vendedoras <small>03</small></button>
        <button data-tab="productsView">Produtos e regras <small>04</small></button>
        <button data-tab="catalogView">Temas e artes <small>05</small></button>
        <button data-tab="campaignsView">Campanhas <small>06</small></button>
        <button data-tab="drivesView">Drives <small>07</small></button>
        <button data-tab="toolsView">Ferramentas <small>08</small></button>
        <button data-tab="textsView">Textos do site <small>09</small></button>
        <button data-tab="whatsappView">WhatsApp e modal <small>10</small></button>
        <button data-tab="linksView">Links e rotas <small>11</small></button>
        <button data-tab="appearanceView">Aparência <small>12</small></button>
        <button data-tab="permissionsView">Permissões <small>13</small></button>
        <button data-tab="advancedView">Avançado <small>14</small></button>
        <button data-tab="jsonView">JSON <small>15</small></button>
      </nav>
      <div class="sideFoot"><a class="btn secondary" href="/">Ver site</a><button id="logoutBtn" class="btn danger" type="button">Sair</button></div>
    </aside>

    <main class="main">
      <header class="topbar"><div><h2 id="adminTitle">Admin do Hub de Artes</h2><p id="adminSubtitle">Controle textos, vendedoras, preços, regras e Drives sem mexer no código.</p></div><div class="actions"><button id="reloadBtn" class="btn secondary" type="button">Recarregar</button><button id="saveBtnTop" class="btn green" type="button">Salvar</button></div></header>
      <div id="status" class="status hidden"></div>

      <section id="overviewView" data-view class="grid"><div id="overview" class="grid span-12"></div></section>
      <section id="ordersView" data-view class="grid hidden"><div id="ordersPanel" class="grid span-12"></div></section>
      <section id="sellersView" data-view class="grid hidden"><div id="sellersPanel" class="grid span-12"></div></section>
      <section id="productsView" data-view class="grid hidden"><div id="productsPanel" class="grid span-12"></div></section>
      <section id="catalogView" data-view class="grid hidden"><div id="catalogPanel" class="grid span-12"></div></section>
      <section id="campaignsView" data-view class="grid hidden"><div id="campaignsPanel" class="grid span-12"></div></section>
      <section id="drivesView" data-view class="grid hidden"><div id="drivesPanel" class="grid span-12"></div></section>
      <section id="toolsView" data-view class="grid hidden"><div id="toolsPanel" class="grid span-12"></div></section>
      <section id="textsView" data-view class="grid hidden"><div id="textsPanel" class="grid span-12"></div></section>
      <section id="whatsappView" data-view class="grid hidden"><div id="whatsappPanel" class="grid span-12"></div></section>
      <section id="linksView" data-view class="grid hidden"><div id="linksPanel" class="grid span-12"></div></section>
      <section id="appearanceView" data-view class="grid hidden"><div id="appearancePanel" class="grid span-12"></div></section>
      <section id="permissionsView" data-view class="grid hidden"><div id="permissionsPanel" class="grid span-12"></div><div id="usersPanel" class="grid span-12"></div></section>
      <section id="advancedView" data-view class="grid hidden"><div id="advancedPanel" class="grid span-12"></div></section>
      <section id="jsonView" data-view class="grid hidden"><div class="card span-12"><div class="sectionHead"><div><h3>JSON completo</h3><p>Visualização técnica do que será salvo no Cloudflare KV.</p></div></div><pre id="jsonPreview" class="jsonBox"></pre></div></section>
    </main>

    <footer class="saveBar"><div class="actions"><button id="saveBtn" class="btn green" type="button">Salvar alterações</button><button id="reloadBtnBottom" class="btn secondary" type="button">Recarregar</button><span id="saveHint" class="hint"></span></div></footer>
  </section>

  <script>
    (function(){
      function $(id){return document.getElementById(id)}
      function showLoginError(msg){var s=$('loginStatus');if(!s)return;s.textContent=msg||'Usuário ou senha inválidos.';s.className='status err';s.classList.remove('hidden')}
      function lockLogin(locked){var form=$('loginForm');if(!form)return;Array.from(form.querySelectorAll('input,button')).forEach(function(el){el.disabled=!!locked});var btn=form.querySelector('button[type="submit"]');if(btn)btn.textContent=locked?'Entrando...':'Entrar'}
      async function submitLogin(event){
        var form=$('loginForm');
        if(!form || event.target!==form)return;
        event.preventDefault();
        event.stopPropagation();
        if(event.stopImmediatePropagation)event.stopImmediatePropagation();
        var username=(($('username')&&$('username').value)||'admin').trim()||'admin';
        var password=(($('password')&&$('password').value)||'').trim();
        if(!password){showLoginError('Informe a senha.');return false}
        lockLogin(true);
        try{
          var res=await fetch('/api/admin/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username,password:password})});
          var data=await res.json().catch(function(){return {}});
          if(!res.ok||data.ok===false)throw new Error(data.error||'Usuário ou senha inválidos.');
          var check=await fetch('/api/admin/config?ts='+Date.now(),{credentials:'include',cache:'no-store'});
          if(!check.ok)throw new Error('Login aceito, mas a sessão não foi reconhecida. Recarregue e tente novamente.');
          window.location.replace('/adm/?ok='+Date.now());
        }catch(err){lockLogin(false);showLoginError(err.message||'Usuário ou senha inválidos.');}
        return false;
      }
      document.addEventListener('submit',submitLogin,true);
      window.__ARMAZEM_LOGIN_CAPTURE__=true;
    })();
  </script>
  <script src="/assets/admin.js?v=4" defer></script>
  <script src="/assets/admin-catalog-unified.js?v=1" defer></script>
  <script src="/assets/admin-ui-fix.js?v=3" defer></script>
  <script src="/assets/admin-site-texts-real.js?v=1" defer></script>
  <script src="/assets/admin-login-fix.js?v=2" defer></script>
  <script src="/assets/admin-permissions-real.js?v=1" defer></script>
  <script src="/assets/admin-vendor-panel.js?v=3" defer></script>
</body>
</html>
